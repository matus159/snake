name: Dárek hráči

# Ruční spuštění: pošle hráči diamanty (třeba jako náhradu za chybu). Hráč je dostane,
# až otevře hru, a uvidí zprávu „Hráč <od> ti poslal … 💎“.
on:
  workflow_dispatch:
    inputs:
      to:
        description: Komu (jméno hráče)
        required: true
      amount:
        description: Kolik diamantů
        required: true
      from:
        description: Od koho (ukáže se ve zprávě)
        required: true
        default: adamini

jobs:
  gift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send gift
        env:
          TO: ${{ inputs.to }}
          AMOUNT: ${{ inputs.amount }}
          FROM: ${{ inputs.from }}
        run: |
          jq -n --arg to "$TO" --arg from "$FROM" --argjson amount "$AMOUNT" '{to:$to, from:$from, amount:$amount}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data @- https://snake-adamini.pages.dev/api/progress/gift
