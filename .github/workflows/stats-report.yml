name: Stats report

# Ruční spuštění: vypíše, kolik hráčů (zařízení) a jaká jména hra za 24 hodin zaznamenala.
on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch report
        run: curl -sS --fail https://snake-adamini.pages.dev/api/stats/report
