<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- jeden duhový přechod přes hlavu i tělo -->
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="140" y1="30" x2="372" y2="482">
      <stop offset="0" stop-color="hsl(0,92%,58%)"/>
      <stop offset="0.2" stop-color="hsl(45,92%,58%)"/>
      <stop offset="0.4" stop-color="hsl(120,92%,58%)"/>
      <stop offset="0.6" stop-color="hsl(190,92%,58%)"/>
      <stop offset="0.8" stop-color="hsl(250,92%,62%)"/>
      <stop offset="1" stop-color="hsl(310,92%,60%)"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0f0f1a"/>
  <!-- hlava: trochu menší a nahoře, s okem -->
  <rect x="156" y="30" width="200" height="200" rx="20" fill="url(#rainbow)"/>
  <circle cx="256" cy="130" r="40" fill="#000"/>
  <!-- tělo -->
  <rect x="136" y="242" width="240" height="240" rx="24" fill="url(#rainbow)"/>
</svg>
